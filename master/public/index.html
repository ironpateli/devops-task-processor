<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Task Processor</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>Master Node Dashboard</h1>
                <p>Monitoring distributed worker tasks over internal Docker network.</p>
            </div>
            <div class="controls">
                <button id="addJobBtn" class="btn primary">Deploy 10 Jobs</button>
            </div>
        </header>

        <section class="stats-panel">
            <div class="stat-box total">
                <h3>Total Jobs</h3>
                <span id="statTotal">0</span>
            </div>
            <div class="stat-box pending">
                <h3>Pending (Queue)</h3>
                <span id="statPending">0</span>
            </div>
            <div class="stat-box processing">
                <h3>Processing (Workers)</h3>
                <span id="statProcessing">0</span>
            </div>
            <div class="stat-box completed">
                <h3>Completed</h3>
                <span id="statCompleted">0</span>
            </div>
        </section>

        <section class="jobs-list">
            <div class="list-header">
                <h2>Recent Jobs</h2>
                <span class="pulse-indicator">Live Updates</span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Job ID</th>
                            <th>Status</th>
                            <th>Difficulty</th>
                            <th>Worker Node</th>
                            <th>Result Hash</th>
                            <th>Duration</th>
                        </tr>
                    </thead>
                    <tbody id="jobsTableBody">
                        <!-- Jobs will be rendered here -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
