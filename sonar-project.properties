sonar.projectKey=task-processor
sonar.projectName=Distributed Task Processor
sonar.projectVersion=2.0

# Source and test paths
sonar.sources=apps/api/src,apps/web/app,apps/web/components
sonar.tests=apps/api/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/dist/**
sonar.test.exclusions=**/node_modules/**,**/.next/**

# Code coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Language settings
sonar.language=js

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
